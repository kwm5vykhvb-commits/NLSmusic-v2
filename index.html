<!doctype html>
<html lang="fr" class="dark" data-theme="spotify-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>NLSmusic - Téléchargeur & Lecteur MP3</title>
    <meta name="description" content="Application de streaming et téléchargement de musique depuis YouTube avec conversion MP3 haute qualité, mode hors-ligne complet, sauvegarde sur l'appareil et bibliothèque intelligente." />
    <meta property="og:title" content="NLSmusic - Téléchargeur & Lecteur MP3" />
    <meta property="og:description" content="Application de streaming et téléchargement de musique depuis YouTube avec conversion MP3 haute qualité, mode hors-ligne complet, sauvegarde sur l'appareil et bibliothèque intelligente." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- PWA & Mobile Web App Support -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1db954" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NLSmusic" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('nlsmusic_theme') || 'spotify-dark';
          document.documentElement.setAttribute('data-theme', saved);
          if (saved === 'minimal-light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-[#121212] text-white selection:bg-[#1db954] selection:text-black overflow-hidden antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
